name: nix-repro

# Bonus task (Lab 11): prove reproducibility in CI. Two parallel jobs build
# .#docker on two fresh runners; a third job fails the workflow if the
# digests differ. Job B also collects the Task 1 evidence (store hash, /health,
# devShell) so the CI run doubles as the "second independent environment".

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Flip to "true" to demonstrate that the gate catches divergence (B.3):
  # job A then pins a non-epoch image `created` timestamp in its own checkout
  # only (a simulated wall-clock leak into the image config — SOURCE_DATE_EPOCH
  # class of failure), and the verify job goes red. Kept "false" in every
  # normal commit.
  BREAK_REPRO: "true"

jobs:
  build-a:
    name: "env A — nix build .#docker"
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout (SHA-pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix (SHA-pinned)
        uses: DeterminateSystems/nix-installer-action@c723f3a885e3f1d866d91f4f0c33dd44b1fc7c60 # v18

      - name: "[red-run demo only] deliberately break reproducibility in this job"
        if: env.BREAK_REPRO == 'true'
        run: sed -i 's|tag = "lab11";|tag = "lab11"; created = "2026-01-01T00:00:00Z";|' flake.nix

      - name: Build the deterministic OCI image
        run: nix build .#docker

      - name: Digest (sha256sum result | awk '{print $1}')
        id: digest
        run: echo "digest=$(sha256sum result | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-b:
    name: "env B — nix build .#docker + Task 1 evidence"
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      store-hash: ${{ steps.storehash.outputs.store-hash }}
    steps:
      - name: Checkout (SHA-pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix (SHA-pinned)
        uses: DeterminateSystems/nix-installer-action@c723f3a885e3f1d866d91f4f0c33dd44b1fc7c60 # v18

      - name: Build the quicknotes binary
        run: nix build .#quicknotes

      - name: Store hash of the binary (Task 1, second environment)
        id: storehash
        run: |
          nix-store -q --hash $(readlink -f result) | tee store-hash.txt
          echo "store-hash=$(cat store-hash.txt)" >> "$GITHUB_OUTPUT"

      - name: Run the binary and probe /health
        run: |
          ADDR=:8080 DATA_PATH="$RUNNER_TEMP/notes.json" SEED_PATH="$PWD/app/seed.json" \
            ./result/bin/quicknotes &
          APP_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          echo
          curl -sf http://localhost:8080/health || { echo "::error::/health did not answer"; kill $APP_PID; exit 1; }
          kill $APP_PID

      - name: devShell smoke test (go, gopls, golangci-lint)
        run: nix develop -c sh -c 'go version && gopls version | head -1 && golangci-lint --version'

      - name: Build the deterministic OCI image
        run: nix build .#docker

      - name: Digest (sha256sum result | awk '{print $1}')
        id: digest
        run: |
          cp -L result quicknotes-lab11.tar.gz
          echo "digest=$(sha256sum result | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload the image tarball (for local `docker load`)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quicknotes-lab11-image
          path: quicknotes-lab11.tar.gz
          if-no-files-found: error

  verify:
    name: "digests must match"
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    steps:
      - name: Compare the two digests
        run: |
          echo "env A digest: ${{ needs.build-a.outputs.digest }}"
          echo "env B digest: ${{ needs.build-b.outputs.digest }}"
          if [ "${{ needs.build-a.outputs.digest }}" != "${{ needs.build-b.outputs.digest }}" ]; then
            echo "::error::reproducibility broken: the two independent builds produced different digests"
            exit 1
          fi
          echo "OK: identical digests — build is reproducible"
