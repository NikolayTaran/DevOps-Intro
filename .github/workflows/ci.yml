# Lab 9 Bonus — the Lab 3 PR gate (vet / test / lint) extended with
# govulncheck, a reachability-aware Go vulnerability gate that BLOCKS the
# PR when a CVE is reachable from the QuickNotes call graph.
#
# Lab 3 §1.1 discipline kept:
#   - runner pinned to ubuntu-24.04 (not ubuntu-latest)
#   - every third-party action pinned to a full 40-char commit SHA
#   - least-privilege permissions: contents: read
#   - any failing job blocks the PR (enforced by the ci-ok aggregate job)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  vet:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: app/go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: app/go.mod
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      # golangci-lint v2.5.0 is built with Go 1.25 and panics type-checking a
      # Go 1.26 toolchain ("file requires newer Go version go1.26"). Pin the
      # lint job to the language version go.mod targets; vet/test/govulncheck
      # stay on 1.26 to match the Dockerfile build image.
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: app/go.mod
      - uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
        with:
          version: v2.5.0
          working-directory: app

  # Lab 9 Bonus: govulncheck — pinned scanner version, never @latest.
  govulncheck:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: app/go.mod
      - name: Install govulncheck (pinned v1.1.4)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  # Aggregate gate: the PR is green only when every job above is green.
  ci-ok:
    if: